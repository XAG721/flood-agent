[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flood-warning-system"
version = "0.1.0"
description = "Event-driven flood warning and personalized response platform"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46.0.0",
  "fastapi>=0.128.0",
  "pydantic>=2.8.2",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
rag-evaluation = [
  "numpy>=1.26",
  "huggingface-hub>=0.23",
  "pyarrow>=15",
  "torch>=2.4",
  "transformers>=4.46,<6",
]

[tool.setuptools.packages.find]
include = ["flood_system*"]

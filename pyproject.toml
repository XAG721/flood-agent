[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flood-warning-system"
version = "0.3.2"
description = "Event-driven flood warning and personalized response platform"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46.0.0",
  "fastapi>=0.128.0",
  "openpyxl>=3.1.5,<4",
  "pillow>=12.3,<13",
  "pydantic>=2.8.2",
  "pypdf>=5.9,<7",
  "tzdata>=2025.2; platform_system == 'Windows'",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = [
  "httpx2>=2.5,<3",
  "numpy>=1.26,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.15.21,<0.16",
  "scikit-learn>=1.6,<2",
]
postgres = [
  "psycopg[binary]>=3.3,<4",
]
rag-evaluation = [
  "numpy>=1.26",
  "huggingface-hub>=0.23",
  "pyarrow>=15",
  "scikit-learn>=1.6,<2",
  "sentence-transformers>=3.3,<4",
  "torch>=2.4",
  "transformers>=4.46,<6",
]

[tool.setuptools.packages.find]
include = ["flood_system*"]

[tool.setuptools.package-data]
flood_system = [
  "bootstrap_data/*.csv",
  "bootstrap_data/*.json",
  "bootstrap_data/compensation_inputs/*.csv",
  "rag_benchmarks/*.json",
  "rag_raw/*.md",
  "rag_raw/*/*.docx",
  "rag_raw/*/*.json",
  "compat/legacy_platform/*.json",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"scripts/inspect_demo_db.py" = ["E402"]
"scripts/rebuild_demo_db.py" = ["E402"]

services:
  postgis:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${FLOOD_POSTGRES_DB:-flood}
      POSTGRES_USER: ${FLOOD_POSTGRES_USER:-flood}
      POSTGRES_PASSWORD: ${FLOOD_POSTGRES_PASSWORD:-simulation-only-change-me}
    ports:
      - "127.0.0.1:${FLOOD_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FLOOD_DB_PATH: /app/data/flood_warning_system.db
      FLOOD_ENVIRONMENT: development
      FLOOD_REQUIRE_HTTPS: "0"
      FLOOD_TRUST_PROXY_HEADERS: "1"
      FLOOD_ALLOW_DEV_IDENTITY_HEADERS: "1"
      FLOOD_SUPERVISOR_LOOP_ENABLED: "0"
    volumes:
      - flood-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/run_response_worker.py", "--interval", "10"]
    environment:
      FLOOD_DB_PATH: /app/data/flood_warning_system.db
      FLOOD_ENVIRONMENT: development
      FLOOD_SUPERVISOR_LOOP_ENABLED: "0"
      FLOOD_ALLOW_DEV_IDENTITY_HEADERS: "1"
      FLOOD_RESPONSE_WORKER_HEALTH_FILE: /tmp/response-worker-health.json
    volumes:
      - flood-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,time; path='/tmp/response-worker-health.json'; assert os.path.exists(path) and time.time() - os.path.getmtime(path) < 45"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  flood-data:
  postgis-data:

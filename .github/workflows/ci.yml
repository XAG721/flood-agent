name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and test runner
        run: python -m pip install ".[test]"
      - name: Run backend suite
        run: python -m pytest -q --basetemp "${RUNNER_TEMP}/flood-pytest"

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            3D_visual/package-lock.json
            frontend/package-lock.json
      - name: Install Cesium build dependencies
        run: npm ci --prefix 3D_visual
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend suite
        run: npm test --prefix frontend -- --run
      - name: Build production frontend
        run: npm run build --prefix frontend

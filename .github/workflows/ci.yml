name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and test runner
        run: python -m pip install ".[test]"
      - name: Run backend suite
        run: python -m pytest -q --basetemp "${RUNNER_TEMP}/flood-pytest"
      - name: Reproduce controlled acceptance evaluations
        run: |
          python scripts/generate_floodagent_bench.py --output "${RUNNER_TEMP}/acceptance/floodagent_bench.json"
          python scripts/run_candidate_evaluation.py --input "${RUNNER_TEMP}/acceptance/candidate_evaluation_input.json" --output "${RUNNER_TEMP}/acceptance/candidate_report.json"
          python scripts/run_rag_evaluation.py --output-dir "${RUNNER_TEMP}/acceptance/rag"
          python scripts/export_openapi.py --output "${RUNNER_TEMP}/openapi.json"
          cmp docs/openapi.json "${RUNNER_TEMP}/openapi.json"

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            3D_visual/package-lock.json
            frontend/package-lock.json
      - name: Install Cesium build dependencies
        run: npm ci --prefix 3D_visual
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend suite
        run: npm test --prefix frontend -- --run
      - name: Build production frontend
        run: npm run build --prefix frontend

  compose:
    name: Compose build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose contract
        run: docker compose config --quiet
      - name: Build simulation environment images
        run: docker compose build
      - name: Start simulation environment
        run: docker compose up --detach --wait --wait-timeout 180
      - name: Verify service health
        run: |
          curl --fail --show-error http://127.0.0.1:8000/ready
          curl --fail --show-error http://127.0.0.1:8080/healthz
          docker compose ps
      - name: Capture service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop simulation environment
        if: always()
        run: docker compose down --volumes --remove-orphans
